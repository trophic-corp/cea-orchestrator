name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      firmware: ${{ steps.detect.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          [ -f backend/package.json ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
          [ -f firmware/CMakeLists.txt ] && echo "firmware=true" >> "$GITHUB_OUTPUT" || echo "firmware=false" >> "$GITHUB_OUTPUT"

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run build --if-present
        working-directory: backend

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build --if-present
        working-directory: frontend

  firmware:
    needs: detect
    if: needs.detect.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py build

  deploy:
    needs: [backend, frontend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy prod stack
        run: |
          echo "Deploy step is a placeholder — build-deploy-engineer wires this to the actual"
          echo "prod host once docker-compose.prod.yml has real services in it."
